<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Book Manager</title>
        <style>
            table {
                width: 100%;
                border-collapse: collapse;
                margin-bottom: 2rem;
            }
            th,
            td {
                border: 1px solid #ccc;
                padding: 0.5rem;
            }
        </style>
    </head>

    <body>
        <h1>Quản lý sách</h1>
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Tiêu đề</th>
                    <th>Số lượng</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                {% for item in books %}
                <tr>
                    <td>{{ item.id }}</td>
                    <form action="/edit/{{item.id}}" method="POST">
                    <td>
                        <input type="text" name="name" value="{{item.name}}" required />
                    </td>
                    <td>
                        <input
                            type = "number"
                            name = "quantity"
                            value="{{item.quantity}}"
                            min="0"
                            required
                        />
                    </td>
                    <td>
                        <button type="submit">Lưu</button>
                    </form>
                        <form
                            action="/delete/{{ item.id }}"
                            method="GET"
                            onsubmit="return confirm('Xóa sách này?')" >
                        <button>Xoá</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <div>
            <h2>Thêm sách</h2>

            <form action="/add" method="POST">
                <input type="text" name ="id" placeholder="ID" required />
                <input type="text" name ="name" placeholder="Tên sách" required />
                <input type="number" name ="quantity" placeholder="Số lượng" required />
                
                <button type="submit">Thêm</button>
            </form>
        </div>
    </body>
</html>
